[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "servicelense"
version = "0.2.0"
description = "Validate and explore Codex source dependency reports offline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
servicelense = "servicelense.cli:main"

[tool.setuptools.packages.find]
include = ["servicelense*"]

[tool.setuptools.package-data]
servicelense = ["assets/*.html", "assets/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
